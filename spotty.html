<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotty – Play Spotify at Timestamp</title>

  <!-- Open Graph / Discord embed -->
  <meta property="og:title" content="Spotty – Play Spotify at Timestamp">
  <meta property="og:description" content="Click to play this Spotify track starting at the chosen time.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://umarhq.com/spotty.html">
  <meta property="og:image" content="https://umarhq.com/spotty-og.png"> <!-- optional: add an image later -->
  <meta name="theme-color" content="#1DB954">

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 520px;
      margin: 40px auto;
      padding: 20px;
      background: #121212;
      color: #fff;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 6px;
    }
    p {
      color: #b3b3b3;
      margin-top: 0;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background: #282828;
      color: white;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #1DB954;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #1ed760;
    }
    #status {
      margin-top: 16px;
      color: #b3b3b3;
      min-height: 24px;
    }
    #embed {
      margin-top: 20px;
      border-radius: 12px;
      overflow: hidden;
    }
  </style>

  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</head>
<body>
  <h1>Spotty</h1>
  <p>Works best when logged into Spotify in this browser</p>

  <input id="link" placeholder="Spotify track link or ID">
  <input id="time" placeholder="Time (1:23 or 83)">
  <button onclick="play()">Play from timestamp</button>

  <div id="status">Waiting for player...</div>
  <div id="embed"></div>

  <script>
    let controller = null;
    let pendingTrack = null;
    let pendingSeconds = 0;

    function parseTime(t) {
      if (!t) return 0;
      if (String(t).includes(':')) {
        const parts = String(t).split(':').map(Number);
        return parts[0] * 60 + (parts[1] || 0);
      }
      return parseInt(t) || 0;
    }

    function extractTrackId(input) {
      if (!input) return null;
      const match = String(input).match(/(?:track[/:]|spotify:track:)([a-zA-Z0-9]{22})/);
      if (match) return match[1];
      if (/^[a-zA-Z0-9]{22}$/.test(input)) return input;
      return null;
    }

function play(trackId = null, seconds = null) {
  const status = document.getElementById('status');

  if (!trackId) {
    trackId = extractTrackId(document.getElementById('link').value.trim());
    seconds = parseTime(document.getElementById('time').value.trim());
  }

  if (!trackId) {
    status.textContent = 'Invalid track';
    return;
  }

  if (!controller) {
    pendingTrack = trackId;
    pendingSeconds = seconds;
    status.textContent = 'Player loading… will start soon';
    return;
  }

  status.textContent = `Starting at ${seconds}s…`;

  // Load the track at the correct time
  controller.loadEntity(`spotify:track:${trackId}`, false, seconds);

  // Multiple play attempts to improve chance of autoplay
  const tryPlay = (attempt = 1) => {
    controller.play();
    status.textContent = `Playing from ${seconds}s`;

    // Try a few more times in case the first ones are blocked
    if (attempt < 4) {
      setTimeout(() => tryPlay(attempt + 1), 600 * attempt);
    }
  };

  // First attempt after a short delay
  setTimeout(() => tryPlay(1), 800);
}
    function readUrlAndPlay() {
      // 1. Hash style (old format): #track/ID.83
      const hash = window.location.hash.slice(1);
      const hashMatch = hash.match(/^track\/([a-zA-Z0-9]{22})\.(\d+)$/);
      if (hashMatch) {
        const id = hashMatch[1];
        const sec = parseInt(hashMatch[2], 10);
        document.getElementById('link').value = id;
        document.getElementById('time').value = sec;
        play(id, sec);
        return;
      }

      // 2. Query style (recommended for Discord): ?track=ID&t=83
      const params = new URLSearchParams(window.location.search);
      if (params.get('track')) {
        const id = extractTrackId(params.get('track'));
        const sec = parseTime(params.get('t') || '0');
        document.getElementById('link').value = params.get('track');
        document.getElementById('time').value = params.get('t') || '0';
        play(id, sec);
      }
    }

    window.onSpotifyIframeApiReady = (IFrameAPI) => {
      const element = document.getElementById('embed');
      IFrameAPI.createController(element, {
        width: '100%',
        height: 152,
        theme: 'dark'
      }, (c) => {
        controller = c;
        document.getElementById('status').textContent = 'Player ready';

        // Play anything that was waiting
        if (pendingTrack) {
          play(pendingTrack, pendingSeconds);
          pendingTrack = null;
        }
      });
    };

    // Run on first load
    readUrlAndPlay();

    // React when the hash changes
    window.addEventListener('hashchange', readUrlAndPlay);

    // React to browser back/forward
    window.addEventListener('popstate', readUrlAndPlay);
  </script>
</body>
</html>
