<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotty</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 520px;
      margin: 40px auto;
      padding: 20px;
      background: #121212;
      color: #fff;
    }
    h1 { font-size: 1.5rem; margin-bottom: 6px; }
    p { color: #b3b3b3; margin-top: 0; }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background: #282828;
      color: white;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #1DB954;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #1ed760; }
    #status {
      margin-top: 16px;
      color: #b3b3b3;
      min-height: 24px;
    }
    #embed {
      margin-top: 20px;
      border-radius: 12px;
      overflow: hidden;
    }
  </style>
  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</head>
<body>
