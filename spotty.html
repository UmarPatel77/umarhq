<!DOCTYPE html>
<html>
<head>
  <title>Spotify Timestamp Player</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 520px;
      margin: 50px auto;
      padding: 20px;
      background: #121212;
      color: #fff;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      box-sizing: border-box;
    }
    input {
      background: #282828;
      color: white;
    }
    button {
      background: #1DB954;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #1ed760;
    }
    #status {
      margin-top: 18px;
      color: #b3b3b3;
      min-height: 24px;
    }
  </style>
</head>
<body>
  <h2>Spotify Timestamp Player</h2>
  <p style="color:#b3b3b3; font-size:14px;">Paste a Spotify track link + time</p>

  <input id="link" placeholder="https://open.spotify.com/track/..." />
  <input id="time" placeholder="Time (e.g. 1:23 or 83)" />
  <button onclick="playTrack()">Play from timestamp</button>

  <div id="status"></div>

  <script>
    // Change this to your backend URL when you deploy it
    const BACKEND = "http://127.0.0.1:5000";   // local testing
    // const BACKEND = "https://your-backend.up.railway.app";  // later

    async function playTrack() {
      const link = document.getElementById("link").value.trim();
      const time = document.getElementById("time").value.trim() || "0";
      const status = document.getElementById("status");

      if (!link) {
        status.textContent = "Please paste a Spotify track link";
        return;
      }

      status.textContent = "Sending request...";

      try {
        const res = await fetch(
          `${BACKEND}/play?track=${encodeURIComponent(link)}&t=${encodeURIComponent(time)}`
        );
        const data = await res.json();

        if (data.ok) {
          status.textContent = `Playing from ${data.start_seconds}s`;
        } else {
          status.textContent = `Error: ${data.error}`;
        }
      } catch (err) {
        status.textContent = "Could not reach the player backend";
      }
    }

    // Optional: auto-fill from URL parameters (?track=...&t=...)
    const params = new URLSearchParams(window.location.search);
    if (params.get("track")) {
      document.getElementById("link").value = params.get("track");
      document.getElementById("time").value = params.get("t") || "0";
    }
  </script>
</body>
</html>
