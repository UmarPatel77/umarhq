<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotiky</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 520px;
      margin: 40px auto;
      padding: 20px;
      background: #121212;
      color: #fff;
      text-align: center;
    }
    h1 { margin-bottom: 8px; }
    p { color: #b3b3b3; }
    #status {
      margin: 20px 0;
      color: #1DB954;
      min-height: 24px;
    }
    #embed {
      margin-top: 20px;
      border-radius: 12px;
      overflow: hidden;
    }
  </style>
  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</head>
<body>
  <h1>Spotiky</h1>
  <p>Playing Spotify track at timestamp</p>
  <div id="status">Loading...</div>
  <div id="embed"></div>

  <script>
    let controller = null;

    // Parse URL: /track/TRACKID.SECONDS
    function parseSpotikyUrl() {
      const path = window.location.pathname; // e.g. /track/5YL9rgtFHTJpX1v4GKFK2h.83
      const match = path.match(/\/track\/([a-zA-Z0-9]{22})\.(\d+)/);
      
      if (match) {
        return {
          trackId: match[1],
          seconds: parseInt(match[2], 10)
        };
      }
      return null;
    }

    window.onSpotifyIframeApiReady = (IFrameAPI) => {
      const element = document.getElementById('embed');
      
      IFrameAPI.createController(element, {
        width: '100%',
        height: 152,
        theme: 'dark'
      }, (c) => {
        controller = c;
        startPlayback();
      });
    };

    function startPlayback() {
      const data = parseSpotikyUrl();
      const status = document.getElementById('status');

      if (!data) {
        status.textContent = 'Invalid Spotiky link';
        return;
      }

      if (!controller) {
        status.textContent = 'Player loading...';
        return;
      }

      status.textContent = `Starting at ${data.seconds}s...`;

      // This is the same method that worked in your original spotty.html
      controller.loadEntity(`spotify:track:${data.trackId}`, false, data.seconds);

      setTimeout(() => {
        controller.play();
        status.textContent = `Playing from ${data.seconds}s (best if logged into Spotify)`;
      }, 900);
    }
  </script>
</body>
</html>
