<!DOCTYPE html>
<html>
<head>
  <title>Spotify Timestamp Player</title>
  <style>
    body { font-family: system-ui; max-width: 600px; margin: 40px auto; padding: 20px; }
    input, button { padding: 10px; font-size: 16px; margin: 5px 0; width: 100%; box-sizing: border-box; }
    button { background: #1DB954; color: white; border: none; cursor: pointer; }
    #status { margin-top: 15px; color: #666; }
  </style>
  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</head>
<body>
  <h2>Spotify Timestamp Player</h2>
  <p>Paste a Spotify track link + time (works best if you're logged into Spotify in this browser)</p>

  <input id="link" placeholder="https://open.spotify.com/track/.... or just the ID" value="">
  <input id="time" placeholder="Time (e.g. 1:23 or 83)" value="">
  <button onclick="loadTrack()">Play from timestamp</button>

  <div id="status"></div>
  <div id="embed-iframe" style="margin-top:20px;"></div>

  <script>
    let controller = null;

    window.onSpotifyIframeApiReady = (IFrameAPI) => {
      const element = document.getElementById('embed-iframe');
      IFrameAPI.createController(element, { width: '100%', height: 152 }, (c) => {
        controller = c;
      });
    };

    function loadTrack() {
      const link = document.getElementById('link').value.trim();
      const timeStr = document.getElementById('time').value.trim();
      const status = document.getElementById('status');

      // Extract track ID
      let trackId = link;
      const match = link.match(/track\/([a-zA-Z0-9]+)/);
      if (match) trackId = match[1];

      if (!trackId || trackId.length < 10) {
        status.textContent = "Please paste a valid Spotify track link or ID";
        return;
      }

      // Parse time (supports 1:23 or 83)
      let seconds = 0;
      if (timeStr.includes(':')) {
        const parts = timeStr.split(':').map(Number);
        seconds = parts[0] * 60 + (parts[1] || 0);
      } else {
        seconds = parseInt(timeStr) || 0;
      }

      status.textContent = `Loading track… starting at ${seconds}s (make sure you're logged into Spotify)`;

      if (controller) {
        controller.loadEntity(`spotify:track:${trackId}`, false, seconds);
        setTimeout(() => controller.play(), 800);
      }
    }

    // Auto-load if URL has params
    const params = new URLSearchParams(window.location.search);
    if (params.get('track')) {
      document.getElementById('link').value = params.get('track');
      document.getElementById('time').value = params.get('t') || '0';
      setTimeout(loadTrack, 1000);
    }
  </script>
</body>
</html>
